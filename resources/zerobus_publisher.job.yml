resources:
  jobs:
    zerobus_publisher:
      name: "[${bundle.target}] publix-zerobus-publisher"
      # OPTIONAL DEMO: pre-run before the workshop or run as a background service.
      # Streams synthetic Publix sales + price events into bronze.pos_sales_raw and bronze.price_updates_raw.
      # Lab 1 shows this as a demo; participants do not hand-code the publisher.
      # Bronze tables will contain sample data by the time Lab 2 starts.
      tasks:
        - task_key: publish
          spark_python_task:
            python_file: ../src/zerobus/publisher.py
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "3"
            dependencies:
              - databricks-zerobus-ingest-sdk
      # Zerobus endpoint + service-principal creds are wired at deploy time
      # (via job env / secret scope). See README "Deploy".
