# a realistic demo). sqft: store size. opened: YYYY-MM-DD.
# NUM_STORES for synthetic generation is inferred from this list length.
stores:
  - {id: 1, name: "Downtown - Main St",   address: "100 Main St",       city: "San Jose",      state: CA, lat: 37.3352, lng: -121.8907, sqft: 1400, opened: "2017-03-15"}
  - {id: 2, name: "Midtown - 2nd Ave",    address: "220 2nd Ave",       city: "San Jose",      state: CA, lat: 37.3701, lng: -121.8635, sqft: 1300, opened: "2018-06-20"}
  - {id: 3, name: "Westside - El Camino",  address: "571 El Camino",     city: "Mountain View", state: CA, lat: 37.3894, lng: -122.0947, sqft: 1250, opened: "2019-08-05"}
  - {id: 4, name: "Eastside - Berryessa",  address: "1737 Berryessa Rd", city: "San Jose",      state: CA, lat: 37.3701, lng: -121.8635, sqft: 1350, opened: "2016-01-10"}
