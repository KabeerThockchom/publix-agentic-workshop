# ---- Synthetic data generation knobs (notebook 01) --------------------------
data_generation:
  days_of_history: 365
  transactions_per_day_avg: 200

# ---- Genie natural-language sample questions --------------------------------
# Domain-flavored starters shown in the embedded Genie space.
genie_sample_questions:
  - "Which stores had the highest sales last week?"
  - "Show me labor cost as a percentage of revenue by store."
  - "Which ingredients are most often below par level?"
  - "What are the peak transaction hours across the fleet?"
  - "Compare weekend vs weekday revenue for the top 5 stores."
