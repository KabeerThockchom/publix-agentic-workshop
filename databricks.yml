bundle:
  name: publix-agentic-workshop

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog for the workshop. Each participant should override this to their own publix_agentic_<yourname> (e.g., publix_agentic_sai).
    default: publix_agentic_workshop
  bronze_schema:
    description: Schema holding the Zerobus landing tables.
    default: bronze

targets:
  dev:
    default: true
    mode: development
    workspace:
      # Profile added once the FEVM workspace is Active (databricks auth login ... -p publix-workshop)
      profile: publix-workshop
    variables:
      catalog: publix_agentic_workshop
      bronze_schema: bronze
