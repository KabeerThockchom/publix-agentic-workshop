bundle:
  name: publix-agentic-workshop

include:
  - resources/*.yml

variables:
  catalog:
    description: Shared Unity Catalog for the workshop (all participants use this).
    default: publix_technology
  schema:
    description: Per-participant schema (each participant overrides to agentic_ai_training_<yourname>).
    default: agentic_ai_training_workshop

targets:
  dev:
    default: true
    mode: development
    workspace:
      # Profile added once the FEVM workspace is Active (databricks auth login ... -p publix-workshop)
      profile: publix-workshop
    variables:
      catalog: publix_technology
      schema: agentic_ai_training_workshop
